name = "dt-stock"
main = "dt-stock-worker.js"
compatibility_date = "2026-01-01"

[vars]
FIREBASE_PROJECT_ID = "dt-club"
# 개발 중 인증 게이트를 끄려면 "false" (운영에서는 절대 끄지 말 것)
REQUIRE_AUTH = "true"
# AI 계좌 평가 — OpenAI 키가 Pages 쪽에 있어서 Pages Function 을 서버끼리 부른다
# (REVIEW_SECRET 은 secret 으로 양쪽에 설정)
AI_WORKER_URL = "https://dt-1js.pages.dev"

# KV — 일봉/검색 캐시 (현재가·호가는 TTL이 짧아 워커 메모리 캐시 사용)
# wrangler kv namespace create STOCK_KV --config functions/wrangler-stock.toml
[[kv_namespaces]]
binding = "STOCK_KV"
id = "4a2b6f90383f4e46b7a2808599a2c892"

# Secrets: KIS_APP_KEY·KIS_APP_SECRET(한국투자증권 Open API — 야간선물), REVIEW_SECRET
# 등록: pbpaste | tr -d "[:space:]" | npx wrangler secret put KIS_APP_KEY --config functions/wrangler-stock.toml

# 모의투자 장부 (D1) — 이 워커만 접근한다
# 스키마 적용: npx wrangler d1 execute dt-mock --remote --file mock/schema.sql --config wrangler-stock.toml
[[d1_databases]]
binding = "MOCK_DB"
database_name = "dt-mock"
database_id = "9f3385ce-0c5f-41ae-a8dc-b25df64e912f"

# 평일 08:00~20:05 KST 매분 — 미체결 주문 체결(프리·정규·애프터마켓), 장 마감 후 종가 저장,
# 20:00 애프터마켓 종료 직후 남은 주문 만료 (19:59 에 끝나면 20:00 마감분이 다음 날 아침까지 남는다)
#   KST 08:00~08:59 = UTC 전날 23:00~23:59 (일~목) / KST 09:00~19:59 = UTC 00:00~10:59 (월~금) / KST 20:00~20:05 = UTC 11:00~11:05
[triggers]
# KST 23:30~23:44 = UTC 14:30~14:44 — 결제일 정산(미수·동결·연체이자, 담보비율, 만기). 한 번에 못 끝내면 다음 분이 이어서 한다
crons = ["* 23 * * SUN-THU", "* 0-10 * * MON-FRI", "0-5 11 * * MON-FRI", "30-44 14 * * MON-FRI"]

# 크론 작업을 실제로 도는 곳 (dt-stock-worker.js 의 MockCron) — 무료 요금제는 SQLite 방식만 된다.
# 저장소는 쓰지 않는다. 크론 호출 CPU 10ms 한도를 피하려고 둔다
[[durable_objects.bindings]]
name = "MOCK_CRON"
class_name = "MockCron"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MockCron"]

# 크론·체결 오류를 대시보드(Workers Logs)에 남긴다 — 지금까지는 실패해도 흔적이 없었다
[observability]
enabled = true
